<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISH ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:40px 20px;
}

/* BOX STYLE */
.container{
max-width:500px;
margin:auto;
background:rgba(0,0,0,0.5);
padding:30px;
border-radius:25px;
border:5px solid red;
animation:borderColor 4s infinite linear;
box-shadow:0 0 30px white;
}

@keyframes borderColor{
0%{border-color:red;}
25%{border-color:green;}
50%{border-color:yellow;}
75%{border-color:blue;}
100%{border-color:red;}
}

/* TITLE */
.mainTitle{
font-size:40px;
font-weight:bold;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:10px;
animation:colorChange 3s infinite;
text-shadow:0 0 25px #00ffff;
}

@keyframes colorChange{
0%{color:#00ffff;}
25%{color:#00ff00;}
50%{color:#ff00ff;}
75%{color:#ffff00;}
100%{color:#00ffff;}
}

.glow{
font-size:30px;
text-shadow:0 0 20px #00ffff;
margin-bottom:15px;
}

input{
width:95%;
padding:15px;
margin:12px 0;
border:none;
border-radius:12px;
font-size:18px;
}

button{
width:100%;
padding:16px;
margin:12px 0;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.login{ background:#00ff99; color:black; }
.topup{ background:#00c3ff; color:black; }
.contact{
background:transparent;
border:2px solid white;
color:white;
}

.footer{
color:#00ffcc;
margin-top:20px;
font-size:18px;
}

/* DASHBOARD STYLE */
.dashboard{
display:none;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

.card{
background:#111;
padding:15px;
margin:10px 0;
border-radius:15px;
box-shadow:0 0 15px #00ffff;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN SECTION -->
<div id="loginSection">
<div class="mainTitle">NISH DIAMOND STORE</div>
<p style="font-size:18px;">🚀 Delivery Within 10 Minutes</p>

<div class="glow">ADMIN LOGIN</div>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button class="login" onclick="login()">LOGIN</button>

<div class="footer">Sri Lanka No 1 Diamond Seller</div>
</div>

<!-- DASHBOARD SECTION -->
<div class="dashboard" id="dashboard">

<div class="mainTitle">WELCOME ADMIN 🎉</div>

<div class="card">💎 Total Orders : 125</div>
<div class="card">📦 Pending Orders : 3</div>
<div class="card">💰 Today Income : LKR 12,500</div>

<button class="topup" onclick="alert('Topup Page Opened')">OPEN TOPUP PAGE</button>
<button class="contact" onclick="logout()">LOGOUT</button>

</div>

</div>

<script>
function login(){
var user = document.getElementById("username").value;
var pass = document.getElementById("password").value;

if(user === "ow" && pass === "2"){
document.getElementById("loginSection").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Wrong Username or Password ❌");
}
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("loginSection").style.display="block";
}
</script>

</body>
</html>
