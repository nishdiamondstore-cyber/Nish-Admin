<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISH ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:40px 20px;
}

.container{
max-width:500px;
margin:auto;
background:rgba(0,0,0,0.5);
padding:30px;
border-radius:25px;
border:5px solid red;
animation:borderColor 4s infinite linear;
box-shadow:0 0 30px white;
}

@keyframes borderColor{
0%{border-color:red;}
25%{border-color:green;}
50%{border-color:yellow;}
75%{border-color:blue;}
100%{border-color:red;}
}

/* 🔥 MAIN STORE TITLE LOKU KARA */
.mainTitle{
font-size:40px;   /* loku kara */
font-weight:bold;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:10px;
animation:colorChange 3s infinite;
text-shadow:0 0 25px #00ffff;
}

@keyframes colorChange{
0%{color:#00ffff;}
25%{color:#00ff00;}
50%{color:#ff00ff;}
75%{color:#ffff00;}
100%{color:#00ffff;}
}

.glow{
font-size:32px;
color:white;
text-shadow:0 0 20px #00ffff;
margin-bottom:15px;
}

input{
width:95%;
padding:15px;
margin:12px 0;
border:none;
border-radius:12px;
font-size:18px;
}

button{
width:100%;
padding:16px;
margin:12px 0;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.login{
background:#00ff99;
color:black;
}

.topup{
background:#00c3ff;
color:black;
}

.contact{
background:transparent;
border:2px solid white;
color:white;
}

.footer{
color:#00ffcc;
margin-top:20px;
font-size:18px;
}

.successBig{
display:none;
background:#00ff99;
color:black;
padding:15px;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
animation:pop 0.5s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<div class="successBig" id="successBox">
🎉 LOGIN SUCCESSFULLY 🎉
</div>

<div class="mainTitle">NISH DIAMOND STORE</div>
<p style="font-size:18px;">🚀 Delivery Within 10 Minutes</p>

<div class="glow">NISH ADMIN</div>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button class="login" onclick="login()">LOGIN</button>

<button class="topup" onclick="openTopup()">TOP UP NOW</button>

<button class="contact" onclick="contactAdmin()">CONTACT ADMIN</button>

<div class="footer">Sri Lanka No 1 Diamond Seller</div>

</div>

<script>
let isLoggedIn = false;

function login(){
var user = document.getElementById("username").value;
var pass = document.getElementById("password").value;

if(user === "ow" && pass === "2"){
isLoggedIn = true;
document.getElementById("successBox").style.display="block";
}else{
alert("Wrong Username or Password ❌");
}
}

function openTopup(){
if(!isLoggedIn){
alert("Please First Login ❗");
}else{
alert("Top Up Page Opened!");
}
}

function contactAdmin(){
window.open("https://wa.me/94762514994?text=Hello%20Admin%20I%20need%20help","_blank");
}
</script>

</body>
</html>
