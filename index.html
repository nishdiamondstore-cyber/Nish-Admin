<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISH ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:20px;
animation:zoomIn 1s ease;
}

@keyframes zoomIn{
from{transform:scale(0.8);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.container{
max-width:400px;
margin:auto;
background:rgba(0,0,0,0.4);
padding:20px;
border-radius:20px;
border:4px solid red;
animation:borderColor 4s infinite linear;
box-shadow:0 0 20px white;
}

@keyframes borderColor{
0%{border-color:red;}
25%{border-color:green;}
50%{border-color:yellow;}
75%{border-color:blue;}
100%{border-color:red;}
}

.colorText{
font-size:22px;
font-weight:bold;
animation:colorChange 3s infinite;
}

@keyframes colorChange{
0%{color:#00ffff;}
25%{color:#00ff00;}
50%{color:#ff00ff;}
75%{color:#ffff00;}
100%{color:#00ffff;}
}

.glow{
font-size:28px;
color:white;
text-shadow:0 0 15px #00ffff;
margin-bottom:10px;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:95%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.login{
background:#00ff99;
color:black;
}

.topup{
background:#00c3ff;
color:black;
}

.contact{
background:transparent;
border:2px solid white;
color:white;
}

.footer{
color:#00ffcc;
margin-top:15px;
}

.successMsg{
background:#00ff99;
color:black;
padding:10px;
border-radius:10px;
margin-bottom:10px;
display:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="successMsg" id="successBox">
Login Successfully ✅
</div>

<div class="colorText">NISH DIAMOND STORE</div>
<p>🚀 Delivery Within 10 Minutes</p>

<div class="glow">NISH ADMIN</div>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button class="login" onclick="login()">LOGIN</button>

<button class="topup" onclick="openTopup()">TOP UP NOW</button>

<button class="contact" onclick="contactAdmin()">CONTACT ADMIN</button>

<div class="footer">Sri Lanka No 1 Diamond Seller</div>

</div>

<script>
let isLoggedIn = false;

function login(){
var user = document.getElementById("username").value;

if(user !== ""){
isLoggedIn = true;
document.getElementById("successBox").style.display="block";
}else{
alert("Enter Username First");
}
}

function openTopup(){
if(!isLoggedIn){
alert("Please First Login ❗");
}else{
alert("Top Up Page Opened!");
}
}

function contactAdmin(){
window.open("https://wa.me/94762514994?text=Hello%20Admin%20I%20need%20help","_blank");
}
</script>

</body>
</html>
