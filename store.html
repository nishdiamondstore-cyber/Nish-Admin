<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAVIYA PACKAGES</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:140px;
}

/* ADMIN PANEL */
.admin-panel{
position:fixed;
top:15px;
right:15px;
background:linear-gradient(45deg,#000,#0d1b3d);
padding:12px;
border-radius:15px;
z-index:999;
text-align:center;
box-shadow:0 0 20px #00ffcc;
}

.admin-panel button{
background:#00ffcc;
border:none;
padding:8px 20px;
border-radius:25px;
font-weight:bold;
cursor:pointer;
}

.admin-status{
margin-top:8px;
padding:6px 12px;
background:#00ffcc;
color:black;
border-radius:20px;
font-size:12px;
display:none;
}

/* PRODUCTS */
.section{margin-bottom:40px;}
.section h2{color:#00e0ff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}

.card{
background:#0d1b3d;
padding:15px;
border-radius:15px;
border:2px solid #00ffcc;
text-align:center;
}

.price{
color:#00ffcc;
font-weight:bold;
cursor:pointer;
margin:8px 0;
}

.counter{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.counter button{
width:30px;
height:30px;
border:none;
border-radius:50%;
background:#00c2d1;
color:white;
font-weight:bold;
cursor:pointer;
}

/* BOTTOM BAR */
.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
box-shadow:0 0 10px #00ffcc;
}

.next-btn{
background:#00ffcc;
border:none;
padding:10px 30px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<div class="admin-panel">
<button onclick="adminLogin()">ADMIN</button>
<div class="admin-status" id="adminStatus">ADMIN PANEL ON</div>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAiZ-Tu007FfvaD-1xn4O6FpkBhijLQRA0",
authDomain: "nish-store.firebaseapp.com",
databaseURL: "https://nish-store-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "nish-store",
storageBucket: "nish-store.appspot.com",
messagingSenderId: "391397321336",
appId: "1:391397321336:web:d42bd399532e0b611f1b8d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const packagesRef = ref(db,"packages");

let adminMode=false;
let cart={};
let sections=[];

window.adminLogin=function(){
let pass=prompt("Enter Admin Password");
if(pass==="Nish678@"){
adminMode=true;
document.getElementById("adminStatus").style.display="block";
alert("Admin Login Successful ✅");
}else{
alert("Wrong Password ❌");
}
}

onValue(packagesRef,(snapshot)=>{
sections=snapshot.val();
render();
});

function render(){
let container=document.getElementById("products");
container.innerHTML="";
let index=0;

sections.forEach((section,sIndex)=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;
section.items.forEach((item,iIndex)=>{
container.innerHTML+=`
<div class="card">
<h4>${item[0]}</h4>
<div class="price" onclick="editPrice(${sIndex},${iIndex})">LKR ${item[1]}</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>`;
cart[index]=0;
index++;
});
container.innerHTML+=`</div></div>`;
});
}

window.editPrice=function(sIndex,iIndex){
if(!adminMode) return;
let newPrice=prompt("New Price:");
if(newPrice && !isNaN(newPrice)){
sections[sIndex].items[iIndex][1]=parseInt(newPrice);
update(ref(db,"packages/"+sIndex+"/items/"+iIndex), sections[sIndex].items[iIndex]);
alert("Price Updated for All Devices ✅");
}
}

window.change=function(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let index=0;
sections.forEach(section=>{
section.items.forEach(item=>{
total+=cart[index]*item[1];
index++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
}

window.goCheckout=function(){
let selected=[];
let index=0;
sections.forEach(section=>{
section.items.forEach(item=>{
if(cart[index]>0){
selected.push({
name:item[0],
price:item[1],
qty:cart[index]
});
}
index++;
});
});

if(selected.length===0){
alert("Please select packages ❗");
return;
}

localStorage.setItem("orderItems",JSON.stringify(selected));
window.location.href="checkout.html";
}

</script>
</body>
</html>
