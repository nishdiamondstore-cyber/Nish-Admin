<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:120px;
}

.admin-btn{
position:fixed;
top:10px;
right:10px;
background:red;
color:white;
padding:8px 15px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
z-index:999;
}

.section{margin-bottom:40px;}
.section h2{color:#00e0ff;font-size:22px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
border:2px solid white;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
text-align:center;
position:relative;
}

.edit-btn{
position:absolute;
top:10px;
right:10px;
background:yellow;
color:black;
border:none;
border-radius:10px;
padding:3px 8px;
font-size:12px;
cursor:pointer;
display:none;
}

.price{font-size:16px;font-weight:bold;margin-bottom:15px;}

.counter{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
background:#08142e;
padding:8px;
border-radius:50px;
}

.counter button{
background:#00c2d1;
border:none;
color:white;
width:35px;
height:35px;
border-radius:50%;
font-size:18px;
cursor:pointer;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.total{font-size:18px;font-weight:bold;}

.next-btn{
background:black;
color:white;
border:3px solid;
padding:12px 28px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
animation:borderMove 4s infinite;
}

@keyframes borderMove{
0%{border-color:red;}
25%{border-color:green;}
50%{border-color:yellow;}
75%{border-color:blue;}
100%{border-color:red;}
}
</style>
</head>
<body>

<button class="admin-btn" onclick="adminLogin()">ADMIN ONLY</button>

<div id="products"></div>

<div class="bottom-bar">
<div class="total" id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MSG_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let isAdmin=false;

const sections=[
{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080],
["VIP PLUS MEMBERSHIP",3210],
["S VIP MEMBERSHIP",4640],
["S VIP PLUS MEMBERSHIP",5160]
]
},
{
title:"DAIOMED PACK",
items:[
["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],["8840 💎",23740],
["11500 💎",31000],["15500 💎",41460],["23000 💎",61000],["46000 💎",124000]
]
},
{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 25",300],
["LEVEL 25",300],
["LEVEL 30",450]
]
},
{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}
];

let container=document.getElementById("products");
let cart={};
let index=0;

/* 🔥 LIVE LOAD */
onValue(ref(db,"prices"),snap=>{
let data=snap.val();
if(data){
sections.forEach((sec,s)=>{
sec.items.forEach((item,i)=>{
item[1]=data[s][i];
});
});
}
render();
});

function render(){
container.innerHTML="";
index=0;
sections.forEach((section,s)=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;
section.items.forEach((item,i)=>{
container.innerHTML+=`
<div class="card">
<button class="edit-btn" onclick="editPrice(${s},${i})">Edit</button>
<h3>${item[0]}</h3>
<div class="price">LKR ${item[1]}</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>`;
cart[index]=0;
index++;
});
container.innerHTML+=`</div></div>`;
});
}

window.adminLogin=function(){
let pw=prompt("Enter Admin Password");
if(pw==="Nish678@"){
isAdmin=true;
alert("Admin Login Success");
document.querySelectorAll(".edit-btn").forEach(b=>b.style.display="block");
}else{
alert("Wrong Password");
}
}

window.editPrice=function(s,i){
if(!isAdmin)return;
let newPrice=prompt("Enter New LKR Price");
if(newPrice && !isNaN(newPrice)){
sections[s].items[i][1]=parseInt(newPrice);
let prices=sections.map(sec=>sec.items.map(it=>it[1]));
set(ref(db,"prices"),prices);
}
}

window.change=function(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0)qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let i=0;
sections.forEach(section=>{
section.items.forEach(item=>{
total+=cart[i]*item[1];
i++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
}

window.goCheckout=function(){
alert("Checkout Success");
}

</script>
</body>
</html>
