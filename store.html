<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:140px;
}

.admin-panel{
position:fixed;
top:10px;
right:10px;
background:#000;
padding:10px 15px;
border-radius:12px;
z-index:999;
box-shadow:0 0 10px #00ffff;
}

.admin-panel button{
background:#00ffcc;
border:none;
padding:6px 12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.admin-status{
margin-top:5px;
font-size:12px;
color:#00ff00;
display:none;
}

.section{margin-bottom:40px;}
.section h2{color:#00e0ff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}

.card{
background:#0d1b3d;
padding:15px;
border-radius:15px;
border:2px solid white;
text-align:center;
}

.price{
color:#00ffcc;
font-weight:bold;
cursor:pointer;
}

.counter{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.counter button{
width:30px;
height:30px;
border:none;
border-radius:50%;
background:#00c2d1;
color:white;
font-weight:bold;
cursor:pointer;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
box-shadow:0 0 10px #00ffff;
}

.next-btn{
background:#00ffcc;
border:none;
padding:10px 20px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<div class="admin-panel">
<button onclick="adminLogin()">Admin Login</button>
<div class="admin-status" id="adminStatus">ADMIN MODE ON</div>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASS="Nish678@";
let adminMode=false;

window.adminLogin=function(){
let pass=prompt("Enter Admin Password");
if(pass===ADMIN_PASS){
adminMode=true;
document.getElementById("adminStatus").style.display="block";
alert("Admin Mode Activated");
}else{
alert("Wrong Password");
}
}

let sectionsRef = ref(db,"packages");

const defaultData=[

{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080]
]
},

{
title:"DAIOMED PACK",
items:[
["25 💎",100],
["50 💎",200],
["75 💎",300],
["100 💎",400]
]
},

{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 25",300]
]
},

{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}

];

onValue(sectionsRef,(snapshot)=>{
let data=snapshot.val();
if(data){
render(data);
}else{
set(sectionsRef,defaultData);
}
});

let cart={};
let currentData=[];

function render(sections){
currentData=sections;
let container=document.getElementById("products");
container.innerHTML="";
let index=0;

sections.forEach((section,sIndex)=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach((item,iIndex)=>{
container.innerHTML+=`
<div class="card">
<h4>${item[0]}</h4>
<div class="price" onclick="editPrice(${sIndex},${iIndex})">
LKR ${item[1]}
</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>
`;
cart[index]=0;
index++;
});

container.innerHTML+=`</div></div>`;
});
}

window.editPrice=function(sIndex,iIndex){
if(!adminMode) return;
let newPrice=prompt("Enter new price:");
if(newPrice && !isNaN(newPrice)){
currentData[sIndex].items[iIndex][1]=parseInt(newPrice);
set(sectionsRef,currentData);
}
}

window.change=function(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let index=0;

currentData.forEach(section=>{
section.items.forEach(item=>{
total+=cart[index]*item[1];
index++;
});
});

document.getElementById("total").innerText="Total: "+total+" LKR";
}

window.goCheckout=function(){

let selected=[];
let index=0;

currentData.forEach(section=>{
section.items.forEach(item=>{
if(cart[index] > 0){
selected.push({
name:item[0],
price:item[1],
qty:cart[index]
});
}
index++;
});
});

if(selected.length===0){
alert("Please select at least one package");
return;
}

localStorage.setItem("checkoutItems",JSON.stringify(selected));
window.location.href="checkout.html";
}

</script>

</body>
</html>
