<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:120px;
}

/* ADMIN BUTTON */
.admin-btn{
position:fixed;
top:10px;
right:10px;
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
z-index:999;
}

.admin-panel{
display:none;
position:fixed;
top:50px;
right:10px;
background:#111;
padding:15px;
border-radius:15px;
width:260px;
max-height:400px;
overflow:auto;
box-shadow:0 0 20px red;
z-index:999;
}

.admin-panel input{
width:100%;
margin:4px 0;
padding:5px;
}

.section{ margin-bottom:40px; }
.section h2{ color:#00e0ff; font-size:22px; margin-bottom:20px; }

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
border:2px solid white;
text-align:center;
}

.price{
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
}

.total{ font-size:18px; font-weight:bold; }
</style>
</head>
<body>

<button class="admin-btn" onclick="openAdmin()">ADMIN ONLY</button>

<div class="admin-panel" id="adminPanel">
<h4>Edit Prices</h4>
<div id="adminInputs"></div>
<button onclick="savePrices()">SAVE ALL</button>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div class="total" id="total">Packages Available</div>
</div>

<script>

/* ALL PRODUCTS */
let sections = [

{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080],
["VIP PLUS MEMBERSHIP",3210],
["S VIP MEMBERSHIP",4640],
["S VIP PLUS MEMBERSHIP",5160]
]
},

{
title:"DAIOMED PACK",
items:[
["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],["8840 💎",23740],
["11500 💎",31000],["15500 💎",41460],["23000 💎",61000],["46000 💎",124000]
]
},

{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 25",300],
["LEVEL 25",300],
["LEVEL 30",450]
]
},

{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}

];

/* LOAD SAVED PRICES */
let saved = JSON.parse(localStorage.getItem("allPrices"));
if(saved){
sections.forEach((sec,s)=>{
sec.items.forEach((item,i)=>{
item[1] = saved[s][i];
});
});
}

/* RENDER PRODUCTS */
function render(){
let container = document.getElementById("products");
container.innerHTML="";

sections.forEach(section=>{
container.innerHTML += `<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach(item=>{
container.innerHTML += `
<div class="card">
<h3>${item[0]}</h3>
<div class="price">LKR ${item[1]}</div>
</div>`;
});

container.innerHTML += `</div></div>`;
});
}

render();

/* ADMIN LOGIN */
function openAdmin(){
let pw = prompt("Enter Admin Password:");
if(pw === "Nish678@"){
document.getElementById("adminPanel").style.display="block";
loadAdminInputs();
}else{
alert("Wrong Password ❌");
}
}

/* LOAD ADMIN INPUTS */
function loadAdminInputs(){
let box=document.getElementById("adminInputs");
box.innerHTML="";

sections.forEach((sec,s)=>{
box.innerHTML+=`<h5>${sec.title}</h5>`;
sec.items.forEach((item,i)=>{
box.innerHTML+=`
<label>${item[0]}</label>
<input type="number" id="p-${s}-${i}" value="${item[1]}">
`;
});
});
}

/* SAVE ALL PRICES */
function savePrices(){
let newPrices=[];

sections.forEach((sec,s)=>{
newPrices[s]=[];
sec.items.forEach((item,i)=>{
let val=parseInt(document.getElementById(`p-${s}-${i}`).value);
item[1]=val;
newPrices[s][i]=val;
});
});

localStorage.setItem("allPrices",JSON.stringify(newPrices));
alert("All Prices Updated ✅");
render();
}

</script>

</body>
</html>
