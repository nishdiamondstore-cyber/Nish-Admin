<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:140px;
}

.admin-panel{
position:fixed;
top:10px;
right:10px;
background:#000;
padding:10px;
border-radius:10px;
z-index:999;
}

.section{margin-bottom:40px;}
.section h2{color:#00e0ff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}

.card{
background:#0d1b3d;
padding:15px;
border-radius:15px;
border:2px solid white;
text-align:center;
}

.price{
color:#00ffcc;
font-weight:bold;
cursor:pointer;
}

.counter{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.counter button{
width:30px;
height:30px;
border:none;
border-radius:50%;
background:#00c2d1;
color:white;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
}

.next-btn{
background:#00ffcc;
border:none;
padding:10px 20px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

.alert-box{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:15px;
border:2px solid #00ffcc;
display:none;
z-index:1000;
text-align:center;
}
</style>
</head>
<body>

<div class="admin-panel">
<button onclick="adminLogin()">Admin</button>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<div class="alert-box" id="alertBox">
<p>Please select at least one package</p>
<button onclick="closeAlert()">OK</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
databaseURL: "YOUR_DB_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_MSG_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASS="Nish678@";
let adminMode=false;

window.adminLogin=function(){
let pass=prompt("Enter Admin Password");
if(pass===ADMIN_PASS){
adminMode=true;
alert("Admin Mode ON");
}else{
alert("Wrong Password");
}
}

let sectionsRef = ref(db,"packages");

let cart={};

onValue(sectionsRef,(snapshot)=>{
let data=snapshot.val();
if(data){
render(data);
}
});

function render(sections){
let container=document.getElementById("products");
container.innerHTML="";
let index=0;

sections.forEach((section,sIndex)=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach((item,iIndex)=>{
container.innerHTML+=`
<div class="card">
<h4>${item[0]}</h4>
<div class="price" onclick="editPrice(${sIndex},${iIndex})">
LKR ${item[1]}
</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>
`;
cart[index]=0;
index++;
});

container.innerHTML+=`</div></div>`;
});
}

window.editPrice=function(sIndex,iIndex){
if(!adminMode) return;

let newPrice=prompt("Enter new price:");
if(newPrice && !isNaN(newPrice)){
onValue(sectionsRef,(snap)=>{
let data=snap.val();
data[sIndex].items[iIndex][1]=parseInt(newPrice);
set(sectionsRef,data);
},{onlyOnce:true});
}
}

window.change=function(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let index=0;

onValue(sectionsRef,(snap)=>{
let data=snap.val();
data.forEach(section=>{
section.items.forEach(item=>{
total+=cart[index]*item[1];
index++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
},{onlyOnce:true});
}

window.goCheckout=function(){
let hasItem=false;
for(let key in cart){
if(cart[key]>0){
hasItem=true;
break;
}
}

if(!hasItem){
document.getElementById("alertBox").style.display="block";
return;
}

// if selected → go next page
window.location.href="checkout.html";
}

window.closeAlert=function(){
document.getElementById("alertBox").style.display="none";
}

</script>

</body>
</html>
