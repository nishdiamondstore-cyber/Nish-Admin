<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:140px;
transition:0.3s;
}

/* ADMIN PANEL */
.admin-panel{
position:fixed;
top:10px;
right:10px;
background:#000;
padding:10px;
border-radius:10px;
z-index:999;
}

.admin-panel button{
margin:3px;
padding:5px 10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.hidden{display:none;}

.section{margin-bottom:40px;}
.section h2{color:#00e0ff;font-size:22px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
border:2px solid white;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
text-align:center;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 20px rgba(255,255,255,0.7);
transform:scale(1.03);
}

.price{font-size:16px;font-weight:bold;margin-bottom:15px;}

.counter{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
background:#08142e;
padding:8px;
border-radius:50px;
}

.counter button{
background:#00c2d1;
border:none;
color:white;
width:35px;
height:35px;
border-radius:50%;
font-size:18px;
cursor:pointer;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.next-btn{
background:black;
color:white;
border:3px solid;
padding:12px 28px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
animation:borderMove 4s infinite;
}

@keyframes borderMove{
0%{border-color:green;}
25%{border-color:blue;}
50%{border-color:red;}
75%{border-color:yellow;}
100%{border-color:green;}
}
</style>
</head>
<body>

<!-- ADMIN -->
<div class="admin-panel">
<button onclick="adminLogin()">Admin</button>
<div id="colorOptions" class="hidden">
<button onclick="setTheme('red')" style="background:red;">Red</button>
<button onclick="setTheme('green')" style="background:green;">Green</button>
<button onclick="setTheme('yellow')" style="background:gold;">Yellow</button>
<button onclick="setTheme('blue')" style="background:blue;">Blue</button>
</div>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script>

/* 🔐 ADMIN PASSWORD UPDATED */
const ADMIN_PASS="Nish678@";

function adminLogin(){
let pass=prompt("Enter Admin Password");
if(pass===ADMIN_PASS){
document.getElementById("colorOptions").classList.remove("hidden");
alert("Admin Mode ON");
}else{
alert("Wrong Password");
}
}

function setTheme(color){
if(color=="red"){
document.body.style.background="linear-gradient(to bottom,#2e0606,#1f0202)";
}
if(color=="green"){
document.body.style.background="linear-gradient(to bottom,#062e0f,#021f09)";
}
if(color=="yellow"){
document.body.style.background="linear-gradient(to bottom,#2e2a06,#1f1b02)";
}
if(color=="blue"){
document.body.style.background="linear-gradient(to bottom,#06142e,#020d1f)";
}
localStorage.setItem("theme",color);
}

window.onload=function(){
let saved=localStorage.getItem("theme");
if(saved) setTheme(saved);
};

const sections=[

{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080],
["VIP PLUS MEMBERSHIP",3210],
["S VIP MEMBERSHIP",4640],
["S VIP PLUS MEMBERSHIP",5160]
]
},

{
title:"DAIOMED PACK",
items:[
["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],["8840 💎",23740],
["11500 💎",31000],["15500 💎",41460],["23000 💎",61000],["46000 💎",124000]
]
},

{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 25",300],
["LEVEL 25",300],
["LEVEL 30",450]
]
},

{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}

];

let container=document.getElementById("products");
let cart={};
let index=0;

sections.forEach(section=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach(item=>{
container.innerHTML+=`
<div class="card">
<h3>${item[0]}</h3>
<div class="price">LKR ${item[1]}</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>
`;
cart[index]=0;
index++;
});

container.innerHTML+=`</div></div>`;
});

function change(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let i=0;
sections.forEach(section=>{
section.items.forEach(item=>{
total+=cart[i]*item[1];
i++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
}

function goCheckout(){
let hasItem=false;
for(let i in cart){
if(cart[i]>0){hasItem=true;break;}
}
if(!hasItem){
alert("Please select top up pack!");
return;
}
localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("items",JSON.stringify(
sections.flatMap(section=>section.items)
));
location.href="checkout.html";
}

</script>

</body>
</html>
