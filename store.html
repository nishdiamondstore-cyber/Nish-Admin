<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:140px;
}

.admin-panel{
position:fixed;
top:10px;
right:10px;
background:#000;
padding:10px;
border-radius:10px;
z-index:999;
}

.section{margin-bottom:40px;}
.section h2{color:#00e0ff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}

.card{
background:#0d1b3d;
padding:15px;
border-radius:15px;
border:2px solid white;
text-align:center;
}

.price{
color:#00ffcc;
font-weight:bold;
cursor:pointer;
}

.counter{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.counter button{
width:30px;
height:30px;
border:none;
border-radius:50%;
background:#00c2d1;
color:white;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
padding:15px;
}
</style>
</head>
<body>

<div class="admin-panel">
<button onclick="adminLogin()">Admin</button>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div id="total">Total: 0 LKR</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAiZ-Tu007FfvaD-1xn4O6FpkBhijLQRA0",
authDomain: "nish-store.firebaseapp.com",
databaseURL: "https://nish-store-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "nish-store",
storageBucket: "nish-store.firebasestorage.app",
messagingSenderId: "391397321336",
appId: "1:391397321336:web:d42bd399532e0b611f1b8d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASS="Nish678@";
let adminMode=false;

window.adminLogin=function(){
let pass=prompt("Enter Admin Password");
if(pass===ADMIN_PASS){
adminMode=true;
alert("Admin Mode ON");
}else{
alert("Wrong Password");
}
}

let sectionsRef = ref(db,"packages");

onValue(sectionsRef,(snapshot)=>{
let data=snapshot.val();
if(data){
render(data);
}else{
set(sectionsRef,defaultData);
}
});

const defaultData=[

{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080],
["VIP PLUS MEMBERSHIP",3210],
["S VIP MEMBERSHIP",4640],
["S VIP PLUS MEMBERSHIP",5160]
]
},

{
title:"DAIOMED PACK",
items:[
["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],
["8840 💎",23740],["11500 💎",31000],["15500 💎",41460],
["23000 💎",61000],["46000 💎",124000]
]
},

{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 25",300],
["LEVEL 25",300],
["LEVEL 30",450]
]
},

{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}

];

let cart={};

function render(sections){
let container=document.getElementById("products");
container.innerHTML="";
let index=0;

sections.forEach((section,sIndex)=>{
container.innerHTML+=`<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach((item,iIndex)=>{
container.innerHTML+=`
<div class="card">
<h4>${item[0]}</h4>
<div class="price" onclick="editPrice(${sIndex},${iIndex})">
LKR ${item[1]}
</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>
`;
cart[index]=0;
index++;
});

container.innerHTML+=`</div></div>`;
});
}

window.editPrice=function(sIndex,iIndex){
if(!adminMode) return;

let newPrice=prompt("Enter new price:");
if(newPrice && !isNaN(newPrice)){
onValue(sectionsRef,(snap)=>{
let data=snap.val();
data[sIndex].items[iIndex][1]=parseInt(newPrice);
set(sectionsRef,data);
},{onlyOnce:true});
}
}

window.change=function(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let index=0;

onValue(sectionsRef,(snap)=>{
let data=snap.val();
data.forEach(section=>{
section.items.forEach(item=>{
total+=cart[index]*item[1];
index++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
},{onlyOnce:true});
}

</script>

</body>
</html>
