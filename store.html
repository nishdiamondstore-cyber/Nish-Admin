<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:120px;
}

/* ADMIN BUTTON */
.admin-btn{
position:fixed;
top:10px;
right:10px;
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
z-index:999;
}

.admin-panel{
display:none;
position:fixed;
top:60px;
right:10px;
background:#111;
padding:15px;
border-radius:15px;
width:220px;
box-shadow:0 0 20px red;
z-index:999;
}

.admin-panel input{
width:100%;
margin:5px 0;
padding:5px;
}

.section{ margin-bottom:40px; }
.section h2{ color:#00e0ff; font-size:22px; margin-bottom:20px; }

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
border:2px solid white;
text-align:center;
}

.price{
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}

.counter{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
background:#08142e;
padding:8px;
border-radius:50px;
}

.counter button{
background:#00c2d1;
border:none;
color:white;
width:35px;
height:35px;
border-radius:50%;
cursor:pointer;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
}

.total{ font-size:18px; font-weight:bold; }

.next-btn{
background:black;
color:white;
border:3px solid green;
padding:12px 28px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<button class="admin-btn" onclick="openAdmin()">ADMIN ONLY</button>

<div class="admin-panel" id="adminPanel">
<h4>Edit Daiomed Prices</h4>
<input type="number" id="p0" placeholder="25 💎 Price">
<input type="number" id="p1" placeholder="50 💎 Price">
<input type="number" id="p2" placeholder="75 💎 Price">
<input type="number" id="p3" placeholder="100 💎 Price">
<button onclick="savePrices()">SAVE</button>
</div>

<div id="products"></div>

<div class="bottom-bar">
<div class="total" id="total">Total: 0 LKR</div>
<button class="next-btn">NEXT</button>
</div>

<script>

const sections = [
{
title:"DAIOMED PACK",
items:[
["25 💎",100],
["50 💎",200],
["75 💎",300],
["100 💎",400]
]
}
];

let container = document.getElementById("products");
let cart = {};
let index = 0;

/* LOAD SAVED PRICES */
let saved = JSON.parse(localStorage.getItem("diamondPrices"));
if(saved){
sections[0].items.forEach((item,i)=>{
item[1] = saved[i];
});
}

/* RENDER PRODUCTS */
function render(){
container.innerHTML="";
index=0;

sections.forEach(section=>{
container.innerHTML += `<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach(item=>{
container.innerHTML += `
<div class="card">
<h3>${item[0]}</h3>
<div class="price">LKR ${item[1]}</div>
<div class="counter">
<button onclick="change(${index},-1)">-</button>
<span id="q${index}">0</span>
<button onclick="change(${index},1)">+</button>
</div>
</div>
`;
cart[index]=0;
index++;
});

container.innerHTML += `</div></div>`;
});
}

render();

function change(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let i=0;
sections.forEach(section=>{
section.items.forEach(item=>{
total += cart[i]*item[1];
i++;
});
});
document.getElementById("total").innerText="Total: "+total+" LKR";
}

/* ADMIN LOGIN */
function openAdmin(){
let pw = prompt("Enter Admin Password:");
if(pw === "Nish678@"){
document.getElementById("adminPanel").style.display="block";
}else{
alert("Wrong Password ❌");
}
}

/* SAVE NEW PRICES */
function savePrices(){
let newPrices = [
parseInt(document.getElementById("p0").value),
parseInt(document.getElementById("p1").value),
parseInt(document.getElementById("p2").value),
parseInt(document.getElementById("p3").value)
];

sections[0].items.forEach((item,i)=>{
if(newPrices[i]) item[1]=newPrices[i];
});

localStorage.setItem("diamondPrices",JSON.stringify(newPrices));
alert("Prices Updated ✅");
render();
}

</script>

</body>
</html>
