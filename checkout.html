<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#000,#0a0f1f);
color:white;
padding:15px;
}

h2{text-align:center;color:#00e5ff;}

.box{
background:#111;
padding:15px;
border-radius:14px;
margin:12px 0;
box-shadow:0 0 15px rgba(0,150,255,0.2);
border:1px solid #1f1f1f;
}

.item-line{
display:flex;
justify-content:space-between;
font-size:14px;
margin-top:5px;
}

.total{
color:#00e5ff;
font-weight:bold;
text-align:right;
font-size:18px;
}

.bank-card{
background:#0f0f0f;
padding:25px;
margin:20px 0;
border-radius:20px;
border:1px solid #00c3ff;
box-shadow:0 0 20px rgba(0,195,255,0.5);
text-align:center;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#00c6ff,#0072ff);
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

#contactBtn{
display:none;
background:linear-gradient(90deg,#25D366,#128C7E);
}

input{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:none;
background:#1a1a1a;
color:white;
}

.warning{
color:#ff3b3b;
font-size:13px;
text-align:center;
margin-top:8px;
}

/* SUCCESS POPUP */
#successBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:30px;
border-radius:20px;
border:2px solid #00ff99;
box-shadow:0 0 30px rgba(0,255,150,0.7);
text-align:center;
z-index:999;
animation:pop 0.4s ease;
}

@keyframes pop{
from{transform:translate(-50%,-50%) scale(0.5);opacity:0;}
to{transform:translate(-50%,-50%) scale(1);opacity:1;}
}

.success-icon{
font-size:40px;
color:#00ff99;
}
</style>
</head>
<body>

<h2>🛒 ORDER SUMMARY</h2>

<div id="summary"></div>
<div class="box total" id="total"></div>

<div class="box">

<div class="bank-card">
<h3>🏦 EZ CASH</h3>
<p><strong>EZ No:</strong> 0761723419</p>
</div>

Player Name
<input type="text" id="playerName" placeholder="Enter Player Name">

Player ID
<input type="text" id="playerId" placeholder="Enter Player ID">

WhatsApp Number
<input type="text" id="whatsapp" placeholder="Enter WhatsApp Number">

<br><br>
📤 Upload Transfer Receipt
<input type="file" id="receipt" accept="image/*">

<button onclick="sendToTelegram()">ORDER SENDING</button>

<div class="warning">
EZ Cash ගෙවීමේදී රු.20 වැඩියෙන් දැමීම අනිවාරය වේ.
</div>

<button id="contactBtn" onclick="contactAdmin()">CONTACT ADMIN</button>

</div>

<!-- SUCCESS POPUP -->
<div id="successBox">
<div class="success-icon">✅</div>
<h3>Order Sent Successfully!</h3>
<p>Your Order ID:</p>
<p id="orderDisplay" style="font-weight:bold;"></p>
</div>

<script>

let items = JSON.parse(localStorage.getItem("checkoutItems")) || [];
let summary=document.getElementById("summary");
let total=0;

if(items.length === 0){
summary.innerHTML="<div class='box'>No Items Selected</div>";
}else{
items.forEach(item=>{
let box=document.createElement("div");
box.className="box";

box.innerHTML=
"<strong>"+item.name+"</strong>"+
"<div class='item-line'><span>Qty: "+item.qty+"</span>"+
"<span>"+(item.price*item.qty)+" LKR</span></div>";

summary.appendChild(box);
total+=item.price*item.qty;
});
}

document.getElementById("total").innerText="TOTAL: "+total+" LKR";

let lastOrderId="";
let adminNumber="94762514994"; // Your WhatsApp

async function sendToTelegram(){

let name=document.getElementById("playerName").value;
let id=document.getElementById("playerId").value;
let wp=document.getElementById("whatsapp").value;
let receipt=document.getElementById("receipt");

if(name==""||id==""||wp==""){
alert("Fill all fields!");
return;
}

if(receipt.files.length==0){
alert("Upload receipt!");
return;
}

let orderId="ORD"+Date.now();
lastOrderId=orderId;

let message=
"🛒 NEW ORDER\n\n"+
"🆔 Order ID: "+orderId+"\n"+
"👤 Name: "+name+"\n"+
"🎮 Player ID: "+id+"\n"+
"📲 Customer WhatsApp: "+wp+"\n\n";

items.forEach(item=>{
message+=item.name+" x "+item.qty+" = "+(item.price*item.qty)+" LKR\n";
});

message+="\n💰 Total: "+total+" LKR (+20 EZ Fee)";

let botToken=""8450708390:AAFXeI6NjGc_2xPzuShSRx0FOelfs7LrZC0";
let chatId="8300102049";

let formData=new FormData();
formData.append("chat_id",chatId);
formData.append("caption",message);
formData.append("photo",receipt.files[0]);

await fetch("https://api.telegram.org/bot"+botToken+"/sendPhoto",{
method:"POST",
body:formData
});

document.getElementById("orderDisplay").innerText=orderId;
document.getElementById("successBox").style.display="block";
document.getElementById("contactBtn").style.display="block";

setTimeout(()=>{
document.getElementById("successBox").style.display="none";
},3000);

}

function contactAdmin(){

let fullMessage =
"🛒 ORDER CONFIRMATION\n\n"+
"🆔 Order ID: "+lastOrderId+"\n\n";

items.forEach(item=>{
fullMessage+=item.name+" x "+item.qty+" = "+(item.price*item.qty)+" LKR\n";
});

fullMessage+="\n💰 Total: "+total+" LKR (+20 EZ Fee)";

window.open(
"https://wa.me/"+adminNumber+"?text="+encodeURIComponent(fullMessage),
"_blank"
);

}

</script>

</body>
</html>
